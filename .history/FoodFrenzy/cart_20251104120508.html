<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Cart - FoodFrenzy</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <header class="header">
    <nav class="navbar">
      <div class="container">
        <div class="nav-wrapper">
          <div class="logo"><i class="fas fa-utensils"></i><span>Food<span class="logo-accent">Frenzy</span></span></div>
          <ul class="nav-menu">
            <li><a href="index.html">Home</a></li>
            <li><a href="index.html#menu">Menu</a></li>
            <li><a href="wishlist.html">Wishlist</a></li>
          </ul>
          <div class="nav-icons">
            <a href="index.html" class="btn btn-secondary">Continue Shopping</a>
          </div>
        </div>
      </div>
    </nav>
  </header>

  <main style="padding-top:120px;">
    <div class="container">
      <h1 class="section-title">Your Cart</h1>

      <div class="cart-page-grid">
        <div class="cart-list" id="cartPageItems">
          <!-- Items rendered here -->
        </div>

        <aside class="cart-summary" id="cartPageSummary">
          <h3>Order Summary</h3>
          <div class="summary-row"><span>Subtotal:</span><span id="pageSubtotal">$0.00</span></div>
          <div class="summary-row"><span>Tax (8%):</span><span id="pageTax">$0.00</span></div>
          <div class="summary-row total"><span>Total:</span><span id="pageTotal">$0.00</span></div>
          <button id="pageCheckout" class="btn btn-primary btn-block">Proceed to Checkout</button>
        </aside>
      </div>

    </div>
  </main>

  <footer class="footer" style="margin-top:40px;">
    <div class="container">
      <p class="text-center">&copy; 2025 FoodFrenzy</p>
    </div>
  </footer>

<script>
// Cart page script - standalone
const STORAGE_KEY = 'foodfrenzy_cart';
const TAX_RATE = 0.08;

function loadCart() {
  const raw = localStorage.getItem(STORAGE_KEY);
  return raw ? JSON.parse(raw) : [];
}
function saveCart(cart) { localStorage.setItem(STORAGE_KEY, JSON.stringify(cart)); }

function formatCurrency(n){ return '$' + n.toFixed(2); }

function renderCart() {
  const cart = loadCart();
  const container = document.getElementById('cartPageItems');
  if (!container) return;
  if (cart.length === 0) {
    container.innerHTML = '<div class="cart-empty"><i class="fas fa-shopping-cart"></i><p>Your cart is empty</p><a href="index.html#menu" class="btn btn-secondary">Browse Menu</a></div>';
    updateSummary(0);
    updateNavBadge(0);
    return;
  }

  const html = cart.map(item => `
    <div class="cart-item">
      <div class="cart-item-image">${item.image && item.image.startsWith('assets') ? '<img src="'+item.image+'" alt="'+item.name+'">' : '<span style="font-size:2.5rem;">'+(item.image||'🍽')+'</span>'}</div>
      <div class="cart-item-details">
        <div class="cart-item-name">${item.name}</div>
        <div class="cart-item-price">${formatCurrency(item.price)} each</div>
        <div class="cart-item-controls">
          <button class="quantity-btn" data-id="${item.id}" data-change="-1">-</button>
          <span class="cart-item-quantity">${item.quantity}</span>
          <button class="quantity-btn" data-id="${item.id}" data-change="1">+</button>
        </div>
        <div class="cart-item-subtotal">Subtotal: <strong>${formatCurrency(item.price*item.quantity)}</strong></div>
      </div>
      <button class="remove-btn" data-id="${item.id}"><i class="fas fa-trash"></i></button>
    </div>
  `).join('');

  container.innerHTML = '<div class="cart-items">'+html+'</div>';

  // attach events
  document.querySelectorAll('.quantity-btn').forEach(btn=>btn.addEventListener('click', (e)=>{
    const id = parseInt(btn.dataset.id);
    const change = parseInt(btn.dataset.change);
    updateQuantity(id, change);
  }));
  document.querySelectorAll('.remove-btn').forEach(btn=>btn.addEventListener('click', ()=>{
    const id = parseInt(btn.dataset.id);
    removeItem(id);
  }));

  updateTotals();
}

function updateQuantity(id, change){
  const cart = loadCart();
  const item = cart.find(i=>i.id===id);
  if (!item) return;
  item.quantity += change;
  if (item.quantity <= 0) {
    removeItem(id);
    return;
  }
  saveCart(cart);
  renderCart();
}
function removeItem(id){
  let cart = loadCart();
  cart = cart.filter(i=>i.id!==id);
  saveCart(cart);
  renderCart();
}

function updateTotals(){
  const cart = loadCart();
  const subtotal = cart.reduce((s,i)=>s + i.price*i.quantity,0);
  const tax = subtotal * TAX_RATE;
  const total = subtotal + tax;
  document.getElementById('pageSubtotal').textContent = formatCurrency(subtotal);
  document.getElementById('pageTax').textContent = formatCurrency(tax);
  document.getElementById('pageTotal').textContent = formatCurrency(total);
  updateNavBadge(cart.reduce((s,i)=>s+i.quantity,0));
}

function updateSummary(v){
  const tax = v * TAX_RATE; document.getElementById('pageSubtotal').textContent = formatCurrency(v); document.getElementById('pageTax').textContent = formatCurrency(tax); document.getElementById('pageTotal').textContent = formatCurrency(v+tax);
}

function updateNavBadge(count){
  const badge = document.querySelector('.cart-badge');
  if (badge) { badge.textContent = count; badge.style.display = count>0? 'flex':'none'; }
}

// Checkout button navigates to index checkout section
document.getElementById('pageCheckout').addEventListener('click', ()=>{
  window.location.href = 'index.html#checkout';
});

// initial render
renderCart();

</script>
</body>
</html>
